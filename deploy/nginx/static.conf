server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — все маршруты React Router возвращают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгое кэширование статики (хешированные имена файлов от CRA)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Запрет dot-файлов
    location ~ /\. { deny all; }
}
