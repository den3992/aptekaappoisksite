# Edge Nginx (порт 80/443) — SSL termination + reverse proxy.
# Этот файл применяется ПОСЛЕ получения сертификата.

# Скрываем версию nginx из заголовков ответов и страниц ошибок.
server_tokens off;

# HTTP → HTTPS редирект для всех доменов; ACME-challenge остаётся доступным по HTTP
server {
    listen 80;
    listen [::]:80;
    server_name aptekaa.ru www.aptekaa.ru xn--80aerl0afi.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Главный домен — HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aptekaa.ru www.aptekaa.ru;

    ssl_certificate     /etc/letsencrypt/live/aptekaa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aptekaa.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 30M;

    # === Security headers ===
    # HSTS — 1 год, включая поддомены. Браузер запомнит HTTPS и не пустит на HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Запрет встраивания сайта в iframe (защита от clickjacking).
    add_header X-Frame-Options "DENY" always;
    # Запрет MIME-sniffing — браузер доверяет Content-Type и не угадывает тип.
    add_header X-Content-Type-Options "nosniff" always;
    # При переходе на сторонний сайт отправлять только origin (без query/токенов).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Запрет доступа к камере/микрофону из браузера (нам не нужно).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;

    # 301 со старых URL DigitalOcean-визитки на новую главную (страховка для
    # старых проиндексированных ссылок).
    location /category/      { return 410; }
    location /page/          { return 410; }
    location /images/photos/ { return 410; }

    # Бэкенд API
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SEO: robots.txt и sitemap*.xml — всегда отдаются из backend, БЕЗ bot-detection.
    # Эти location-блоки имеют более высокий приоритет, чем "location /", поэтому
    # bot-rewrite внутри "location /" их не перехватит.
    location = /robots.txt {
        proxy_pass http://backend:8001/api/seo/robots.txt;
        proxy_set_header Host $host;
    }
    location ~ ^/sitemap.*\.xml$ {
        rewrite ^/(.*)$ /api/seo/$1 break;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # Всё остальное — фронт; для ботов поисковиков — SSR-рендер из backend.
    # ВАЖНО: bot-detection ДОЛЖЕН быть внутри location /, а не на уровне server,
    # иначе серверный rewrite сработает в rewrite-фазе РАНЬШЕ location-matching
    # и перехватит даже /robots.txt и /sitemap.xml.
    location / {
        if ($http_user_agent ~* "(YandexBot|Yandex|Googlebot|bingbot|DuckDuckBot|Baiduspider|YandexImages|YandexMetrika)") {
            rewrite ^(.*)$ /api/seo/render?path=$1 last;
        }
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# аптекаа.рф (xn--80aerl0afi.xn--p1ai) — HTTP-редирект на aptekaa.ru
# (HTTPS-блок добавится, когда выпустим SSL для этого домена — DNS ещё пропагирует)
server {
    listen 80;
    listen [::]:80;
    server_name xn--80aerl0afi.xn--p1ai www.xn--80aerl0afi.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aptekaa.ru$request_uri;
    }
}
