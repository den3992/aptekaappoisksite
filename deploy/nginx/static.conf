server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # PWA-критичные файлы — НИКОГДА не кэшируем
    # (фиксированные имена, должны проверяться при каждом заходе).
    # Иначе юзеры видят старую версию сайта неделями.
    # ============================================================

    # Service Worker — без кэша вообще.
    # Если SW закэшируется надолго, юзеры не получат обновления
    # фронтенда, пока сами не сбросят кэш.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        access_log off;
    }

    # index.html — revalidate каждый заход (ETag → 304 если не менялся).
    # Так браузер всегда подхватывает новые ссылки на main.HASH.js/css.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    # Manifest и связанные — тоже без кэша.
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    # SPA fallback — все маршруты React Router возвращают index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Сам по себе ответ от try_files (когда он отдаёт index.html
        # для произвольного маршрута) — тоже не кэшируем.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ============================================================
    # Долгое кэширование статики с хешированными именами
    # (main.HASH.js, main.HASH.css и т.д. — имя меняется при ребилде,
    # поэтому immutable безопасен и оптимален).
    # ============================================================
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Запрет dot-файлов
    location ~ /\. { deny all; }
}
