# Edge Nginx (порт 80/443) — SSL termination + reverse proxy.
# Этот файл применяется ПОСЛЕ получения сертификата.

# Скрываем версию nginx из заголовков ответов и страниц ошибок.
server_tokens off;

# DNS resolver — нужен для OCSP stapling.
# Используем Cloudflare + Google как стабильные resolver'ы.
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# === Rate limiting ===
# Whitelist для поисковых ботов: им rate-limit НЕ применяется (значение 0).
# Все остальные IP получают ключ = $binary_remote_addr.
map $http_user_agent $rl_key {
    default                          "$binary_remote_addr";
    "~*YandexBot|YandexImages|YandexMobileBot|YandexMetrika"  "";
    "~*Googlebot|GoogleOther|AdsBot-Google"                   "";
    "~*bingbot|DuckDuckBot|Baiduspider|YandexAccessibilityBot" "";
}

# Зоны хранения состояния (в shared memory).
# Размер 10m ≈ 160 000 уникальных IP в окне.
#
# api: 30 r/s (за вычетом burst) — поисковая выдача может биться часто.
# search: 10 r/s — search-эндпоинт (потяжелее).
# admin: 5 r/m — админка, чтобы исключить brute-force.
# partner: 1 r/m — submit-форма «Стать партнёром» (предотвращает спам).
limit_req_zone $rl_key zone=api:10m       rate=30r/s;
limit_req_zone $rl_key zone=search:10m    rate=10r/s;
limit_req_zone $rl_key zone=admin:1m      rate=5r/m;
limit_req_zone $rl_key zone=partner:1m    rate=1r/m;

# Возвращаем 429 (Too Many Requests) вместо стандартного 503.
limit_req_status 429;
# Логируем превышения в WARN.
limit_req_log_level warn;

# HTTP → HTTPS редирект для всех доменов; ACME-challenge остаётся доступным по HTTP
server {
    listen 80;
    listen [::]:80;
    server_name aptekaa.ru www.aptekaa.ru xn--80aerl0afi.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Главный домен — HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aptekaa.ru www.aptekaa.ru;

    ssl_certificate     /etc/letsencrypt/live/aptekaa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aptekaa.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling: Let's Encrypt с мая 2025 прекратили включать OCSP responder URL
    # в новые сертификаты (https://letsencrypt.org/2024/12/05/ending-ocsp/), так что
    # stapling больше технически невозможен с LE-сертификатами. Если перейдём на
    # другой CA (ZeroSSL, BuyPass) — раскомментируй блок ниже.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/aptekaa.ru/chain.pem;

    client_max_body_size 30M;

    # =========================================================================
    # Security headers — ЕДИНЫЙ источник: только здесь, в nginx.
    # Backend (FastAPI) больше НЕ устанавливает заголовки безопасности,
    # чтобы избежать дубликатов и конфликтов значений.
    # =========================================================================

    # HSTS — 1 год, включая поддомены. Браузер запомнит HTTPS и не пустит на HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Запрет встраивания сайта в iframe (защита от clickjacking).
    add_header X-Frame-Options "DENY" always;

    # Запрет MIME-sniffing — браузер доверяет Content-Type и не угадывает тип.
    add_header X-Content-Type-Options "nosniff" always;

    # При переходе на сторонний сайт отправлять только origin (без query/токенов).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Запрет доступа к камере (нам не нужно), микрофон разрешён (голосовой поиск),
    # geolocation — только для нашего домена, FLoC выключен.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), interest-cohort=(), payment=()" always;

    # Cross-Origin Opener Policy — изолирует window от чужих popup-контекстов,
    # защищает от XS-Leaks и Spectre. same-origin = строгая изоляция.
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Cross-Origin Resource Policy — запрещает hot-linking наших ресурсов
    # с других сайтов. same-site = разрешено внутри aptekaa.ru, но не извне.
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Content Security Policy — на ВСЕХ маршрутах (HTML и API).
    # 'unsafe-inline' + 'unsafe-eval' нужны для Я.Карт.
    # Список доменов:
    #   - api-maps.yandex.ru, *.yandex.ru/.net — карты + стат. ресурсы Яндекса
    #   - mc.yandex.com — Я.Метрика (counter делает запросы на .com, не только .ru)
    #   - fonts.googleapis.com / fonts.gstatic.com — Google Fonts (Inter + Manrope)
    #   - tts.api.cloud.yandex.net — SpeechKit
    #   - wss: — websocket-обновления Я.Карт
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api-maps.yandex.ru https://*.yandex.ru https://*.yandex.net https://yastatic.net https://mc.yandex.com; script-src-elem 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.yandex.ru https://*.yandex.net https://yastatic.net https://mc.yandex.com; style-src 'self' 'unsafe-inline' https://*.yandex.ru https://*.yandex.net https://yastatic.net https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://*.yandex.ru https://*.yandex.net https://yastatic.net https://fonts.googleapis.com; img-src 'self' data: blob: https://*.yandex.ru https://*.yandex.net https://yastatic.net https://mc.yandex.com; font-src 'self' data: https://*.yandex.ru https://*.yandex.net https://fonts.gstatic.com; connect-src 'self' https://*.yandex.ru https://*.yandex.net https://yastatic.net https://mc.yandex.com https://tts.api.cloud.yandex.net wss:; frame-src 'self' https://yandex.ru https://*.yandex.ru; media-src 'self' data: blob: https://*.yandex.net; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # 301 со старых URL DigitalOcean-визитки на новую главную (страховка для
    # старых проиндексированных ссылок).
    location /category/      { return 410; }
    location /page/          { return 410; }
    location /images/photos/ { return 410; }

    # 301 city-slug aliases → canonical city.id used in sitemap.xml.
    # Sitemap and indexed URLs use /msk/... and /spb/...; some old internal
    # links used /moskva/... — redirect them to consolidate link equity.
    rewrite ^/moskva(/.*)?$            /msk$1            permanent;
    rewrite ^/sankt-peterburg(/.*)?$   /spb$1            permanent;

    # === Бэкенд API ===
    #
    # Search-endpoint (тяжёлый) — отдельный, более строгий rate-limit.
    location ~ ^/api/(search|medications)(/|$) {
        limit_req zone=search burst=20 nodelay;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Админ-эндпоинты — 5 req/min на IP (brute-force protection).
    location ~ ^/api/admin/ {
        limit_req zone=admin burst=10 nodelay;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # POST-форма "Стать партнёром" — 1 req/min, защита от спама.
    location ~ ^/api/partners/request {
        limit_req zone=partner burst=2 nodelay;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Общий fallback для всех остальных /api/ — 30 r/s.
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SEO: robots.txt и sitemap*.xml — всегда отдаются из backend, БЕЗ bot-detection.
    # Эти location-блоки имеют более высокий приоритет, чем "location /", поэтому
    # bot-rewrite внутри "location /" их не перехватит.
    location = /robots.txt {
        proxy_pass http://backend:8001/api/seo/robots.txt;
        proxy_set_header Host $host;
    }
    location ~ ^/sitemap.*\.xml$ {
        rewrite ^/(.*)$ /api/seo/$1 break;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # Статика (favicon, картинки, css/js, шрифты, manifest, IndexNow-ключ) —
    # отдаётся НАПРЯМУЮ с фронта, БЕЗ bot-rewrite. Иначе YandexBot, запрашивая
    # /favicon.svg или /img/meds/*.webp, попадал в /api/seo/render и получал
    # 404 HTML вместо файла («favicon недоступен для робота» в Вебмастере,
    # и Яндекс.Картинки не видели бы фото препаратов).
    # Regex-локация имеет приоритет над префиксным "location /".
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|map|webmanifest)$ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        access_log off;
    }

    # Всё остальное — фронт; для ботов поисковиков — SSR-рендер из backend.
    # ВАЖНО: bot-detection ДОЛЖЕН быть внутри location /, а не на уровне server,
    # иначе серверный rewrite сработает в rewrite-фазе РАНЬШЕ location-matching
    # и перехватит даже /robots.txt и /sitemap.xml.
    location / {
        if ($http_user_agent ~* "(YandexBot|Yandex|Googlebot|bingbot|DuckDuckBot|Baiduspider|YandexImages|YandexMetrika)") {
            rewrite ^(.*)$ /api/seo/render?path=$1 last;
        }
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# аптекаа.рф (xn--80aerl0afi.xn--p1ai) — HTTP-редирект на aptekaa.ru
# (HTTPS-блок добавится, когда выпустим SSL для этого домена — DNS ещё пропагирует)
server {
    listen 80;
    listen [::]:80;
    server_name xn--80aerl0afi.xn--p1ai www.xn--80aerl0afi.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aptekaa.ru$request_uri;
    }
}
