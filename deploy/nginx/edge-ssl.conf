# Edge Nginx (порт 80/443) — SSL termination + reverse proxy.
# Этот файл применяется ПОСЛЕ получения сертификата.

# HTTP → HTTPS редирект для всех доменов; ACME-challenge остаётся доступным по HTTP
server {
    listen 80;
    listen [::]:80;
    server_name aptekaa.ru www.aptekaa.ru xn--80aerl0afi.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Главный домен — HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aptekaa.ru www.aptekaa.ru;

    ssl_certificate     /etc/letsencrypt/live/aptekaa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aptekaa.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 30M;

    # 301 со старых URL DigitalOcean-визитки на новую главную (страховка для
    # старых проиндексированных ссылок).
    location /category/      { return 301 /; }
    location /page/          { return 301 /; }
    location /images/photos/ { return 301 /; }

    # Бэкенд API
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SEO маршруты для ботов: robots.txt и sitemap*.xml идут в backend SSR
    location = /robots.txt   { proxy_pass http://backend:8001/api/seo/robots.txt; }
    location ~ ^/sitemap.*\.xml$ {
        rewrite ^/(.*)$ /api/seo/$1 break;
        proxy_pass http://backend:8001;
    }

    # Bot-detection: User-Agent ботов поисковиков → backend SSR-render
    set $is_bot 0;
    if ($http_user_agent ~* "(YandexBot|Yandex|Googlebot|bingbot|DuckDuckBot|Baiduspider|YandexImages|YandexMetrika)") {
        set $is_bot 1;
    }
    if ($is_bot = 1) {
        rewrite ^(.*)$ /api/seo/render?path=$1 last;
    }

    # Всё остальное — статика React-фронта
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www.aptekaa.ru → aptekaa.ru (выше уже включён в общий server_name; ниже — отдельный 301
# для случаев когда юзер прописал www)
# (Реализовано через server_name выше; nginx будет одинаково отдавать оба).

# аптекаа.рф (xn--80aerl0afi.xn--p1ai) — 301 редирект на основной домен
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--80aerl0afi.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/aptekaa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aptekaa.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://aptekaa.ru$request_uri;
}
