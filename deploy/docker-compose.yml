services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: "mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin"
      DB_NAME: ${MONGO_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      YANDEX_API_KEY: ${YANDEX_API_KEY}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
      YANDEX_WEBMASTER_TOKEN: ${YANDEX_WEBMASTER_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      JWT_SECRET: ${JWT_SECRET}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      IMAP_REPLY_FROM: ${IMAP_REPLY_FROM}
      IMAP_POLL_SECONDS: ${IMAP_POLL_SECONDS}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      PARTNERS_EMAIL: ${PARTNERS_EMAIL}
    depends_on: [mongo]
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  imap_worker:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "scripts.email_imap_worker", "--loop"]
    environment:
      MONGO_URL: "mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin"
      DB_NAME: ${MONGO_DB}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      IMAP_REPLY_FROM: ${IMAP_REPLY_FROM}
      IMAP_POLL_SECONDS: ${IMAP_POLL_SECONDS}
    depends_on: [mongo, backend]
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Next.js приложение в процессе миграции с CRA. До Phase 8 cutover-а
  # не получает трафика из edge — крутится только в internal-сети для
  # тестов и parity-проверок. Никаких publish-портов, edge на него
  # не depends_on, чтобы падение next не повлияло на production.
  next:
    build:
      context: ..
      dockerfile: deploy/next.Dockerfile
      args:
        # Берём из .env (REACT_APP_* — legacy имена, мапим в NEXT_PUBLIC_*).
        NEXT_PUBLIC_YANDEX_MAPS_KEY: ${REACT_APP_YANDEX_MAPS_KEY}
        NEXT_PUBLIC_YANDEX_TILES_KEY: ${REACT_APP_YANDEX_TILES_KEY}
    restart: unless-stopped
    networks: [internal]
    # Bind-mount фото препаратов УБРАН — Next.js standalone кешит public/
    # at start, новые фото не видны runtime. /img/* теперь отдаёт edge nginx
    # напрямую с диска (см. edge.volumes).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
      # /img/* фото препаратов (photo-агент пишет в live-папку, edge отдаёт
      # их напрямую с диска — Next.js standalone кешит public/ at start
      # и не видит файлов добавленных runtime).
      - ../next/public/img:/var/www/img:ro
    depends_on: [backend, next]
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  certbot:
    image: certbot/certbot:latest
    restart: "no"
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'certbot run via deploy.sh, exiting'"]

volumes:
  mongo_data:
  certbot_webroot:
  certbot_etc:

networks:
  internal:
    driver: bridge
